<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>25:00 · Hora de focar | WS Tools</title><style>html,body{margin:0;padding:0;background:#060f20;color:#e7f2ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:460px;margin:18px auto;padding:0 10px}/* Pomodoro shared widget: self-contained styling for web and offline use */
.pomo-widget{--pn:#07162f;--pn2:#102744;--pb:#4b9be8;--pg:#e7bb55;--pw:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--pw);background:radial-gradient(circle at 92% 8%,#254875 0%,transparent 34%),linear-gradient(150deg,var(--pn2),var(--pn));border-radius:22px;overflow:hidden;box-shadow:0 22px 55px rgba(7,22,47,.18);max-width:460px;margin-inline:auto;position:relative;padding:26px 25px 23px;line-height:1.4}
.pomo-widget *, .pomo-widget *::before, .pomo-widget *::after{box-sizing:border-box}
.pomo-widget button,.pomo-widget input{font:inherit}
.pomo-widget button{cursor:pointer}
.pomo-widget button:focus-visible,.pomo-widget input:focus-visible,.pomo-widget summary:focus-visible{outline:3px solid var(--pg);outline-offset:3px}
.pomo-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.pomo-brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;font-size:1.04rem}.pomo-brand-mark{width:32px;height:32px;border:1px solid #d3a948;border-radius:10px;color:var(--pg);display:grid;place-items:center;font-size:1.25rem}.pomo-brand b{color:var(--pg)}.pomo-compact-tag{font-size:.62rem;letter-spacing:.12em;color:#b5d2f1;font-weight:800}.pomo-modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.1);border-radius:12px}.pomo-mode{border:0;background:transparent;color:#afc4dd;padding:9px 3px;border-radius:8px;font-size:.75rem;font-weight:800;white-space:nowrap}.pomo-mode[aria-pressed=true]{background:#e7bb55;color:#07162f;box-shadow:0 3px 8px rgba(0,0,0,.15)}.pomo-clock{position:relative;width:min(100%,252px);aspect-ratio:1;margin:20px auto 10px;display:grid;place-items:center}.pomo-ring{width:100%;height:100%;position:absolute;inset:0;transform:rotate(-90deg)}.pomo-ring-track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:7}.pomo-ring-progress{fill:none;stroke:var(--pg);stroke-width:7;stroke-linecap:round;stroke-dasharray:678.58;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}.pomo-display{text-align:center;position:relative}.pomo-time{font-size:clamp(3.25rem,12vw,4.55rem);line-height:1.05;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.075em}.pomo-phase-label{font-size:.75rem;color:#c2d2e7;text-transform:uppercase;letter-spacing:.2em;font-weight:800;margin:13px 0 0}.pomo-controls{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.65fr) minmax(0,.65fr);gap:8px}.pomo-action{min-height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.11);color:#fff;font-weight:800;font-size:.87rem;padding:8px}.pomo-action-primary{background:var(--pg);color:var(--pn);border-color:var(--pg)}.pomo-action:hover{filter:brightness(1.12)}.pomo-task-field{display:block;margin:17px 0 0;font-size:.74rem;color:#bfd0e4;font-weight:700}.pomo-task-input{display:block;width:100%;margin-top:6px;padding:10px 12px;min-height:39px;background:rgba(255,255,255,.09);color:#fff;border:1px solid rgba(255,255,255,.19);border-radius:9px;font-size:.85rem!important}.pomo-task-input::placeholder{color:#a8bad0}.pomo-footer-stat{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid rgba(255,255,255,.13);padding-top:15px;margin-top:19px;font-size:.79rem;color:#cbd8eb}.pomo-counter strong{color:var(--pg);font-size:1.1rem}.pomo-sound-toggle{display:flex;gap:7px;align-items:center;cursor:pointer}.pomo-sound-toggle input{accent-color:#e7bb55;width:16px;height:16px}.pomo-options{margin-top:12px;border:1px solid rgba(255,255,255,.15);border-radius:11px;background:rgba(255,255,255,.055)}.pomo-options summary{padding:12px 15px;cursor:pointer;font-size:.79rem;font-weight:800;color:#d3e3f5;list-style-position:inside}.pomo-settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:4px 14px 13px}.pomo-settings label{font-size:.68rem;color:#b9cce1;font-weight:700}.pomo-settings input[type=number]{display:block;width:100%;margin-top:6px;background:#fff;border:1px solid #dde7f0;border-radius:8px;color:#07162f;padding:8px;min-height:40px;font-size:.88rem}.pomo-settings .pomo-auto-wrap{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.75rem;cursor:pointer}.pomo-auto-wrap input{accent-color:#e7bb55}.pomo-save{grid-column:1/-1;border:1px solid #e7bb55;background:transparent;color:#e7bb55;border-radius:8px;min-height:38px;font-size:.8rem;font-weight:800}.pomo-status{font-size:.77rem;text-align:center;color:#d7e3f3;min-height:1.2em;margin:12px 0 0}.pomo-status[hidden]{display:none}.pomo-offline-note{text-align:center;color:#64758a;font-size:.76rem;max-width:445px;margin:12px auto 0}.pomo-widget p{margin-bottom:0}
@media(max-width:480px){.pomo-widget{padding:20px 15px 18px;border-radius:18px}.pomo-clock{width:220px;margin:13px auto 10px}.pomo-time{font-size:3.7rem}.pomo-settings{gap:6px;padding:4px 10px 12px}.pomo-settings label{font-size:.65rem}.pomo-settings input[type=number]{padding:6px}.pomo-modes .pomo-mode{font-size:.68rem}}
@media(prefers-reduced-motion:reduce){.pomo-ring-progress{transition:none}}

.pomo-brand-mark{object-fit:contain;flex:0 0 34px;border:0;background:none;border-radius:50%;padding:0}
.pomo-offline-note{color:#b7cae2;max-width:400px;line-height:1.6}
.pomo-offline-credit{margin:14px auto 8px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:.78rem;color:#d8e6f8;padding:14px 5px;border-top:1px solid rgba(143,180,219,.2);text-align:center}
.pomo-offline-credit img{width:32px;height:32px;object-fit:contain}
.pomo-offline-credit a{color:#efc86a;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.pomo-offline-credit a:hover{color:#fff}

r Wendell Soares · <a href="https://wendellsoares.jor.br/" target="_blank" rel="noopener noreferrer">wendellsoares.jor.br ↗</a></span></div></main><script>(()=>{
'use strict';
const byId=id=>document.getElementById(id);
const el=byId('pomo-widget');if(!el)return;
const staticPageTitle=document.title;
const time=byId('pomo-time'),label=byId('pomo-label'),progress=byId('pomo-progress'),start=byId('pomo-start'),status=byId('pomo-status');
const modes=Array.from(el.querySelectorAll('.pomo-mode'));
const inputs={focus:byId('pomo-focus-min'),short:byId('pomo-short-min'),long:byId('pomo-long-min')};
const sound=byId('pomo-sound'),auto=byId('pomo-auto'),task=byId('pomo-task');
const key='ws-tools-pomodoro-preferences-v1';
const ranges={focus:[1,180],short:[1,60],long:[1,90]};
const names={focus:'Hora de focar',short:'Pausa curta',long:'Pausa longa'};
const defaults={focus:25,short:5,long:15};
let durations={...defaults},phase='focus',remaining=25*60,running=false,endAt=0,focuses=0,ticker=null,audioContext=null;
const circumference=2*Math.PI*108;
progress.style.strokeDasharray=String(circumference);
function loadPrefs(){try{const data=JSON.parse(localStorage.getItem(key)||'null');if(data&&typeof data==='object'){
 for(const k of Object.keys(defaults)){const v=Number(data[k]);if(Number.isInteger(v)&&v>=ranges[k][0]&&v<=ranges[k][1])durations[k]=v;}
 sound.checked=data.sound!==false;auto.checked=data.auto===true;
}}catch(_){}}
function storePrefs(){try{localStorage.setItem(key,JSON.stringify({...durations,sound:sound.checked,auto:auto.checked}));}catch(_){}}
function announce(txt){status.textContent=txt}
function secsFor(p){return durations[p]*60}
function update(){
 const s=Math.max(0,Math.ceil(remaining));time.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 const ratio=Math.max(0,Math.min(1,remaining/secsFor(phase)));
 progress.style.strokeDashoffset=String(circumference*(1-ratio));
 progress.style.stroke=phase==='focus'?'#e7bb55':'#7bc9ec';
 label.textContent=names[phase];
 modes.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.phase===phase)));
 start.textContent=running?'Ⅱ Pausar':'▶ Iniciar';
 byId('pomo-cycles').textContent=String(focuses);
 document.title=running?(time.textContent+' · '+names[phase]+' | WS Tools'):staticPageTitle;
}
function stop(){running=false;if(ticker!==null){clearInterval(ticker);ticker=null;}}
function setPhase(next,message){stop();phase=next;remaining=secsFor(next);update();if(message)announce(message)}
function unlockSound(){if(!sound.checked)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext)audioContext=new AC();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});}catch(_){}}
function beep(){if(!sound.checked)return;try{unlockSound();if(!audioContext||audioContext.state!=='running')return;const now=audioContext.currentTime;for(let i=0;i<2;i++){
 const o=audioContext.createOscillator(),gain=audioContext.createGain(),at=now+i*.29;o.type='sine';o.frequency.value=i===0?785:1047;
 gain.gain.setValueAtTime(0.0001,at);gain.gain.exponentialRampToValueAtTime(.16,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+.22);o.connect(gain);gain.connect(audioContext.destination);o.start(at);o.stop(at+.24);
}}catch(_){}}
function complete(){
 const was=phase;stop();beep();
 if(was==='focus'){focuses+=1;phase=focuses%4===0?'long':'short';}
 else phase='focus';
 remaining=secsFor(phase);update();
 announce(was==='focus'?'Foco concluído! Hora da '+(phase==='long'?'pausa longa.':'pausa curta.'):'Pausa encerrada! Volte ao foco.');
 if(auto.checked)begin(true);
}
function tick(){if(!running)return;remaining=Math.max(0,(endAt-Date.now())/1000);if(remaining<=0){complete();return;}update()}
function begin(isAutomatic=false){if(running)return;unlockSound();running=true;endAt=Date.now()+remaining*1000;ticker=setInterval(tick,250);update();if(!isAutomatic)announce('Temporizador em andamento.');}
function pause(){if(!running)return;remaining=Math.max(0,(endAt-Date.now())/1000);stop();if(remaining<=0){complete();return;}update();announce('Pausado. Você pode retomar quando quiser.');}
start.addEventListener('click',()=>running?pause():begin());
byId('pomo-reset').addEventListener('click',()=>setPhase(phase,'Período reiniciado.'));
byId('pomo-skip').addEventListener('click',()=>setPhase(phase==='focus'?'short':'focus','Período pulado, sem contabilizar foco.'));
modes.forEach(btn=>btn.addEventListener('click',()=>setPhase(btn.dataset.phase,'Período selecionado.')));
byId('pomo-settings').addEventListener('submit',event=>{
 event.preventDefault();
 const next={};for(const k of Object.keys(defaults)){
  const raw=inputs[k].value.trim();const v=Number(raw);
  if(!raw||!Number.isInteger(v)||v<ranges[k][0]||v>ranges[k][1]){inputs[k].focus();announce('Informe minutos inteiros dentro do limite de cada campo.');return;}
  next[k]=v;
 }
 durations=next;storePrefs();setPhase(phase,'Tempos ajustados e período reiniciado.');
});
sound.addEventListener('change',storePrefs);auto.addEventListener('change',storePrefs);
loadPrefs();for(const k of Object.keys(defaults))inputs[k].value=String(durations[k]);remaining=secsFor(phase);update();
// A contagem usa o horário real, para reduzir desvios quando o navegador desacelera abas inativas.
window.addEventListener('pageshow',tick);
})();</script></body></html>
